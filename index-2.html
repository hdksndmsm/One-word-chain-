<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>ONE WORD — The Internet's Word</title>
<meta name="description" content="One word. Everyone can change it. What will the internet say next?">
<meta property="og:title" content="ONE WORD — The Internet's Word">
<meta property="og:description" content="One word. Everyone can change it. What will the internet say next?">
<meta name="theme-color" content="#0a0a0a">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:wght@400;600;800&family=Caveat:wght@600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0a0a;--fg:#f4efe8;--mute:#8a8580;--ac:#c8ff3a;--line:#27231f;color-scheme:dark}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font-family:"Bricolage Grotesque",system-ui,sans-serif;line-height:1.45}
main{max-width:820px;margin:0 auto;padding:max(22px,env(safe-area-inset-top)) 18px 56px}
header{display:flex;justify-content:space-between;align-items:center}
.brand{font-weight:800;letter-spacing:.18em;font-size:.95rem}.brand b{color:var(--ac)}
#mode{font-size:.72rem;color:var(--mute);letter-spacing:.15em}
.label{text-align:center;margin-top:44px;font-size:.75rem;letter-spacing:.35em;color:var(--mute)}
button{font:inherit;cursor:pointer}
.edit{display:grid;place-items:center;width:46px;height:46px;margin:12px auto 0;border:1px solid var(--ac);border-radius:50%;background:none;color:var(--ac);transition:transform .15s}
.edit:active{transform:scale(.92)}
#live{margin:26px 0 6px;min-height:150px;display:flex;justify-content:center;align-items:center;text-align:center}
#live>div{width:100%}
#by{text-align:center;color:var(--mute);min-height:1.5em}
#held{text-align:center;margin:14px 0 34px}#held b{color:var(--ac);font-variant-numeric:tabular-nums}
:focus-visible{outline:2px solid var(--ac);outline-offset:3px}
.tiles{display:flex;justify-content:center}
.tile{width:var(--ts);height:calc(var(--ts)*1.25);display:grid;place-items:center;border:max(1.5px,calc(var(--ts)*.04)) solid var(--ac);border-radius:calc(var(--ts)*.16);background:#14110e;font-weight:800;font-size:calc(var(--ts)*.62);text-transform:uppercase;line-height:1}
.enter .tile{animation:pop .5s cubic-bezier(.2,1.4,.4,1) both;animation-delay:calc(var(--i)*35ms)}
.enter .card{animation:rise .5s cubic-bezier(.2,1.2,.4,1) both}
@keyframes pop{from{opacity:0;transform:scale(.4) translateY(14px)}to{opacity:1;transform:none}}
@keyframes rise{from{opacity:0;transform:scale(.88) translateY(10px)}}
.sz-lg{--fs:clamp(1.5rem,6vw,2.4rem)}.sz-lg.long{--fs:clamp(1.1rem,4.2vw,1.65rem)}.sz-sm{--fs:1.05rem}.sz-xs{--fs:.62rem}
/* ---- 9 styles ---- */
.card{position:relative;display:inline-block;max-width:100%;font-size:var(--fs);padding:.9em 1.2em;font-weight:600;overflow-wrap:anywhere;text-align:center;line-height:1.25}
.s-minimal{border:1px solid var(--ac);border-radius:.6em;background:#0f0d0b}
.s-glass{border:1px solid rgba(200,255,58,.55);border-radius:.8em;background:rgba(255,255,255,.06);-webkit-backdrop-filter:blur(10px);backdrop-filter:blur(10px);box-shadow:0 0 1.4em rgba(200,255,58,.16)}
.s-quote{padding:1.5em 1.8em}.q{position:absolute;font-size:2.6em;line-height:1;color:var(--ac);font-weight:800}.q1{left:.2em;top:.05em}.q2{right:.2em;bottom:-.3em}
.s-tape{background:var(--ac);color:#0a0a0a;font-family:Caveat,cursive;font-size:calc(var(--fs)*1.25);transform:rotate(-2deg);border-radius:.15em .45em .2em .5em;box-shadow:.2em .3em 0 rgba(255,255,255,.08)}
.s-tape::before{content:"";position:absolute;top:-.6em;left:50%;width:4em;height:1.2em;margin-left:-2em;background:rgba(244,239,232,.55);transform:rotate(3deg)}
.s-chip{background:var(--ac);color:#0a0a0a;border-radius:999px;padding:.7em 1.7em;box-shadow:0 .5em 1.4em rgba(200,255,58,.3)}.s-chip .dot{margin-right:.5em}
.s-terminal{border:1px solid var(--ac);border-radius:.5em;text-align:left;font-family:ui-monospace,"SF Mono",Menlo,Consolas,monospace;padding:0;overflow:hidden;background:#0d0b09;font-weight:400}
.bar{display:flex;gap:.35em;padding:.55em .7em;border-bottom:1px solid var(--line)}.bar i{width:.55em;height:.55em;border-radius:50%;background:var(--ac);opacity:.85}
.s-terminal .txt{display:block;padding:.9em 1em}.p{color:var(--ac)}.cur{animation:blink 1s steps(2) infinite}@keyframes blink{50%{opacity:0}}
.s-brush{font-family:Caveat,cursive;font-size:calc(var(--fs)*1.3);color:#0a0a0a;background:var(--ac);clip-path:polygon(2% 12%,18% 4%,40% 9%,62% 2%,86% 8%,98% 18%,96% 52%,99% 84%,78% 96%,52% 91%,30% 99%,8% 92%,1% 70%,4% 40%);padding:1.2em 1.9em}
.s-neon{border:2px solid var(--ac);border-radius:.3em;box-shadow:0 0 .6em rgba(200,255,58,.6),inset 0 0 .6em rgba(200,255,58,.25);text-transform:uppercase;letter-spacing:.06em;font-weight:800}
.s-neon::before,.s-neon::after{content:"";position:absolute;width:.8em;height:.8em;border:2px solid var(--fg)}
.s-neon::before{top:-.4em;left:-.4em;border-right:0;border-bottom:0}.s-neon::after{bottom:-.4em;right:-.4em;border-left:0;border-top:0}
.s-split{font-weight:800;line-height:1.1}.s-split .l{display:block;color:var(--mute)}
.s-split .hl{display:inline-block;background:var(--ac);color:#0a0a0a;border-radius:999px;padding:.05em .5em;text-transform:uppercase;margin:.12em 0}
/* ---- stats + history ---- */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-bottom:38px}
.s{border:1px solid var(--line);border-radius:12px;padding:14px 12px}
.s span{display:block;font-size:.62rem;letter-spacing:.2em;color:var(--mute)}
.s b{display:block;margin-top:4px;font-size:1.15rem;overflow-wrap:anywhere}
h2{font-size:.72rem;letter-spacing:.3em;color:var(--mute);font-weight:600;margin:0 0 6px}
ul{list-style:none;margin:0;padding:0}
li{padding:14px 0;border-bottom:1px solid var(--line)}
li.new{animation:rise .5s both}
.pv{margin-bottom:8px}.pv>div{text-align:left}
.meta{display:flex;justify-content:space-between;gap:10px;font-size:.82rem;color:var(--mute)}
.foot{text-align:center;color:var(--mute);margin-top:44px;font-size:.9rem}#note{display:block;margin-top:6px;font-size:.75rem}
/* ---- modal ---- */
dialog{border:1px solid var(--line);background:#100e0c;color:var(--fg);border-radius:20px;padding:22px 18px;width:min(94vw,480px);max-height:92vh;overflow:auto;opacity:0;transform:translateY(16px);transition:opacity .25s,transform .25s,overlay .25s allow-discrete,display .25s allow-discrete}
dialog[open]{opacity:1;transform:none}@starting-style{dialog[open]{opacity:0;transform:translateY(16px)}}
dialog::backdrop{background:rgba(0,0,0,.82)}
dialog h3{margin:0 0 14px;letter-spacing:.3em;font-size:.85rem;color:var(--ac)}
label.f{display:block;font-size:.78rem;color:var(--mute);margin:12px 0 5px}
input[type=text],textarea{width:100%;font:inherit;font-size:1rem;color:var(--fg);background:#0a0a0a;border:1px solid #3a342e;border-radius:10px;padding:12px;resize:none}
.seg{border:0;padding:0;margin:12px 0 0;display:flex;gap:8px}
.seg label{flex:1}.seg input{position:absolute;opacity:0}
.seg span{display:block;text-align:center;padding:11px;border:1px solid #3a342e;border-radius:10px}
.seg input:checked+span{border-color:var(--ac);color:var(--ac)}.seg input:focus-visible+span{outline:2px solid var(--ac)}
.styles{display:flex;gap:8px;overflow-x:auto;padding:4px 0 10px;scroll-snap-type:x mandatory}
.styles label{position:relative;flex:0 0 118px;scroll-snap-align:start;border:1px solid var(--line);border-radius:12px;padding:6px;text-align:center;font-size:.7rem;color:var(--mute);cursor:pointer}
.styles input{position:absolute;opacity:0}.styles label:has(input:checked){border-color:var(--ac);color:var(--fg)}.styles label:has(input:focus-visible){outline:2px solid var(--ac)}
.mini{height:64px;display:grid;place-items:center;overflow:hidden;pointer-events:none}
#prev{min-height:96px;display:flex;align-items:center;justify-content:center;border:1px dashed var(--line);border-radius:12px;padding:12px;margin-top:6px;overflow:hidden}
#prev>div{width:100%;text-align:center}
#hint{font-size:.72rem;color:var(--mute);margin-top:4px}#err{min-height:1.3em;color:#ff8a8a;font-size:.85rem;margin:10px 0 0}
.go{width:100%;margin-top:10px;padding:15px;border:0;border-radius:999px;background:var(--ac);color:#0a0a0a;font-weight:800;letter-spacing:.25em;transition:transform .12s}
.go:active{transform:scale(.97)}.go:disabled{opacity:.5;cursor:not-allowed}
.x{display:block;margin:8px auto 0;background:none;border:0;color:var(--mute);padding:8px}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}}
</style>
</head>
<body>
<main>
  <header><div class="brand">ONE <b>WORD</b></div><div id="mode">LIVE</div></header>
  <div class="label">THE INTERNET'S WORD</div>
  <button class="edit" id="edit" aria-label="Create: replace the live word">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 20h9"/><path d="M16.5 3.5a2.1 2.1 0 013 3L7 19l-4 1 1-4z"/></svg>
  </button>
  <section id="live" aria-live="polite"><div></div></section>
  <div id="by"></div>
  <div id="held">Held for <b id="hv">0s</b></div>

  <section class="stats" aria-label="Statistics">
    <div class="s"><span>TOTAL CHANGES</span><b id="tot">0</b></div>
    <div class="s"><span>LONGEST HOLD</span><b id="lh">-</b></div>
    <div class="s"><span>RECORD WORD</span><b id="rw">-</b></div>
  </section>

  <h2>RECENT CHANGES</h2>
  <ul id="hist"></ul>
  <div class="foot">Someone will change this after you.<span id="note"></span></div>
</main>

<dialog id="dlg" aria-labelledby="dt">
  <form id="form" autocomplete="off">
    <h3 id="dt">CREATE</h3>
    <label class="f" for="nm">Your name</label>
    <input type="text" id="nm" maxlength="16" placeholder="guest">
    <fieldset class="seg"><legend class="f" style="margin:0 0 5px;padding:0">Content type</legend>
      <label><input type="radio" name="type" value="word" checked><span>Word</span></label>
      <label><input type="radio" name="type" value="message"><span>Message</span></label>
    </fieldset>
    <label class="f" for="ct">Your word / message</label>
    <textarea id="ct" rows="2" maxlength="20" placeholder="dream"></textarea>
    <div id="hint"></div>
    <div id="sw" hidden>
      <label class="f" id="sl">Choose a style</label>
      <div class="styles" id="styles" role="radiogroup" aria-labelledby="sl"></div>
    </div>
    <div id="prev" aria-label="Preview"><div></div></div>
    <div id="err" role="alert"></div>
    <button class="go" id="go">CREATE</button>
    <button type="button" class="x" id="cancel">Cancel</button>
  </form>
</dialog>

<script src="config.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2.45.4/dist/umd/supabase.js"></script>
<script>
// Supabase config comes from config.js. Empty = DEMO MODE.
const SB_URL = typeof SUPABASE_URL !== "undefined" ? SUPABASE_URL : "";
const SB_KEY = typeof SUPABASE_ANON_KEY !== "undefined" ? SUPABASE_ANON_KEY : "";

const STYLES = [["minimal","01 Minimal"],["glass","02 Glass"],["quote","03 Quote"],["tape","04 Tape"],["chip","05 Chip"],["terminal","06 Terminal"],["brush","07 Brush"],["neon","08 Neon"],["split","09 Split"]];
const BAD = ["nigger","nigga","faggot","retard","cunt","rape","nazi","fuck","shit"];
const COOL = 10000;
const $ = id => document.getElementById(id);
const esc = s => String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const tms = t => t && t.toMillis ? t.toMillis() : (t || 0);

let cur = null, stats = { totalChanges:0, longestHold:0 }, hist = [], offset = 0, ready = false, busy = false;
let sig = "", seen = new Set(), firstHist = true, demo = false, callCreate = null;

// ---------- time helpers ----------
const now = () => Date.now() + offset;
function dur(s){
  s = Math.max(0, Math.floor(s));
  const d = Math.floor(s/86400), h = Math.floor(s%86400/3600), m = Math.floor(s%3600/60);
  if (d) return d+"d "+h+"h";
  if (h) return h+"h "+m+"m";
  if (m) return m+"m "+(s%60)+"s";
  return s+"s";
}
function ago(ms){
  const s = Math.max(0, (now()-ms)/1000);
  return s < 5 ? "just now" : dur(s)+" ago";
}
function cdLeft(){
  let u = 0; try { u = +localStorage.getItem("ow_cd") || 0; } catch(_){}
  return Math.max(0, Math.ceil((u-Date.now())/1000));
}
function setCd(sec){ try { localStorage.setItem("ow_cd", Date.now()+sec*1000); } catch(_){} }

// ---------- rendering of content (word tiles + 9 styles) ----------
function msgHTML(c){
  const x = esc(c.content), s = c.style;
  let i;
  if (s === "quote") i = '<b class="q q1">“</b><span class="txt">'+x+'</span><b class="q q2">”</b>';
  else if (s === "terminal") i = '<div class="bar"><i></i><i></i><i></i></div><span class="txt"><span class="p">&gt;</span> '+x+'<span class="cur">_</span></span>';
  else if (s === "chip") i = '<span class="dot">✦</span><span class="txt">'+x+'</span>';
  else if (s === "split"){
    const w = c.content.split(" "); let k = 0;
    w.forEach((a, j) => { if (a.length > w[k].length) k = j; });
    i = '<span class="txt">'+(k ? '<span class="l">'+esc(w.slice(0,k).join(" "))+'</span>' : '')+'<span class="hl">'+esc(w[k])+'</span>'+(k < w.length-1 ? '<span class="l">'+esc(w.slice(k+1).join(" "))+'</span>' : '')+'</span>';
  } else i = '<span class="txt">'+x+'</span>';
  return '<div class="card s-'+s+'">'+i+'</div>';
}
function renderContent(el, c, size, enter){
  let h;
  if (c.contentType === "word"){
    const chars = [...c.content], n = chars.length, gap = size === "lg" ? 8 : 4;
    const avail = Math.max(160, el.clientWidth || 320), max = { lg:88, sm:46, xs:22 }[size];
    const w = Math.max(14, Math.min(max, Math.floor((avail-(n-1)*gap)/n)));
    h = '<div class="tiles" style="--ts:'+w+'px;gap:'+gap+'px">'+chars.map((ch,i) => '<span class="tile" style="--i:'+i+'">'+esc(ch)+'</span>').join("")+'</div>';
  } else h = msgHTML(c);
  const long = c.contentType === "message" && c.content.length > 60 ? " long" : "";
  el.innerHTML = '<div class="sz-'+size+long+(enter ? " enter" : "")+'">'+h+'</div>';
}
function renderLive(){
  if (!cur) return;
  const s = cur.contentType+"|"+cur.content+"|"+cur.style+"|"+cur.by+"|"+cur.updatedAt;
  if (s === sig) return;
  sig = s;
  renderContent($("live").firstElementChild, cur, "lg", true);
  $("by").textContent = "by " + cur.by;
}
function previewText(c){
  const t = c.contentType === "word" ? c.content.toUpperCase() : c.content;
  return t.length > 26 ? t.slice(0,25)+"…" : t;
}
function renderStats(){
  const held = cur ? (now()-cur.updatedAt)/1000 : 0;
  const live = cur && held > (stats.longestHold || 0);
  $("tot").textContent = Number(stats.totalChanges || 0).toLocaleString();
  $("lh").textContent = (live ? dur(held) : stats.longestHold ? dur(stats.longestHold) : "-");
  const r = live ? { content:cur.content, contentType:cur.contentType } : { content:stats.recordWord, contentType:stats.recordType };
  $("rw").textContent = r.content ? previewText(r) : "-";
}
function renderHist(){
  const ul = $("hist"); ul.textContent = "";
  hist.forEach(h => {
    const li = document.createElement("li");
    if (!firstHist && !seen.has(h.id)) li.className = "new";
    seen.add(h.id);
    li.innerHTML = '<div class="pv"></div><div class="meta"><span>by '+esc(h.by)+' · held '+dur(h.heldSeconds)+'</span><em style="font-style:normal" data-t="'+h.createdAt+'">'+ago(h.createdAt)+'</em></div>';
    ul.appendChild(li);
    renderContent(li.firstChild, h, "xs", false);
  });
  if (!hist.length) ul.innerHTML = '<li><span class="meta">No changes yet.</span></li>';
  firstHist = false;
}
function setCur(c){ cur = c; renderLive(); renderStats(); tick(); }

// ---------- 1-second tick: held, "x ago", cooldown button ----------
function tick(){
  if (cur) $("hv").textContent = dur((now()-cur.updatedAt)/1000);
  document.querySelectorAll("[data-t]").forEach(e => e.textContent = ago(+e.dataset.t));
  renderStats();
  const left = cdLeft(), b = $("go");
  b.disabled = busy || left > 0 || !ready;
  b.textContent = left > 0 ? "Wait "+left+"s" : "CREATE";
}
setInterval(tick, 1000);
addEventListener("resize", () => { if (cur) { sig = ""; renderLive(); } });

// ---------- validation (UX only; the server validates again) ----------
function clean(raw){
  const name = (raw.name || "").replace(/[<>]/g, "").replace(/\s+/g, " ").trim().slice(0,16) || "guest";
  if (!["word","message"].includes(raw.type)) return { err:"Pick Word or Message." };
  if (!STYLES.some(s => s[0] === raw.style)) return { err:"Pick a style." };
  let c = String(raw.content || "").replace(/[<>]/g, "").replace(/\s+/g, " ").trim();
  if (raw.type === "word"){
    c = c.toLowerCase();
    if (!/^[a-z0-9]{2,20}$/.test(c)) return { err:"A word is 2 to 20 letters or numbers, no spaces." };
  } else {
    if (c.length < 2 || c.length > 140) return { err:"A message is 2 to 140 characters." };
    if (c.split(" ").length > 20) return { err:"A message is 20 words at most." };
  }
  if (BAD.some(b => (c+" "+name).toLowerCase().includes(b))) return { err:"That is not allowed." };
  return { data:{ content:c, contentType:raw.type, by:name, style:raw.style } };
}

// ---------- modal ----------
STYLES.forEach(([k, n], i) => {
  const l = document.createElement("label");
  l.innerHTML = '<input type="radio" name="style" value="'+k+'"'+(i ? '' : ' checked')+'><div class="mini"><div class="sz-xs">'+msgHTML({ content:"small progress", style:k })+'</div></div><span>'+n+'</span>';
  $("styles").appendChild(l);
});
const val = n => document.querySelector('input[name="'+n+'"]:checked').value;
function form(){ return { name:$("nm").value, type:val("type"), style:val("style"), content:$("ct").value }; }
function syncForm(){
  const w = val("type") === "word";
  $("ct").maxLength = w ? 20 : 140; $("ct").rows = w ? 1 : 3;
  $("ct").placeholder = w ? "dream" : "small progress is still progress";
  $("hint").textContent = w ? "2 to 20 letters or numbers. No spaces." : "Up to 20 words.";
  $("sw").hidden = w;
  const f = form(), c = f.content.trim() ? f : Object.assign(f, { content: w ? "dream" : "small progress is still progress" });
  const r = clean(Object.assign({}, c, { content:c.content }));
  const pv = $("prev").firstElementChild;
  if (r.data) renderContent(pv, r.data, "sm", false);
  else renderContent(pv, w ? { content:"…", contentType:"word", style:"minimal" } : { content:c.content.slice(0,140) || "…", contentType:"message", style:c.style }, "sm", false);
}
document.querySelectorAll("#form input, #form textarea").forEach(e => e.addEventListener("input", syncForm));
$("ct").addEventListener("keydown", e => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } });
function openDlg(){
  $("err").textContent = "";
  try { $("nm").value = localStorage.getItem("ow_name") || ""; } catch(_){}
  $("ct").value = "";
  $("dlg").showModal(); syncForm(); tick(); $("ct").focus();
}
$("edit").onclick = openDlg;
$("cancel").onclick = () => $("dlg").close();
$("dlg").addEventListener("click", e => { if (e.target === $("dlg")) $("dlg").close(); });

$("form").addEventListener("submit", async e => {
  e.preventDefault();
  if (busy || cdLeft() > 0 || !ready) return;
  const r = clean(form());
  if (r.err) { $("err").textContent = r.err; return; }
  if (cur && cur.contentType === r.data.contentType && cur.content === r.data.content) { $("err").textContent = "That is already live."; return; }
  busy = true; tick(); $("go").textContent = "...";
  try {
    if (demo) demoCreate(r.data); else await callCreate(r.data);
    setCd(COOL / 1000);
    try { localStorage.setItem("ow_name", r.data.by === "guest" ? "" : r.data.by); } catch(_){}
    $("dlg").close();
  } catch(err){
    const m = String(err && err.message || ""), w = (m.match(/^WAIT:(\d+)/) || [])[1];
    if (w) { setCd(+w); $("err").textContent = "Wait "+w+"s before creating again."; }
    else if (m.startsWith("E:")) $("err").textContent = m.slice(2);
    else $("err").textContent = "Could not create. Please try again.";
  } finally { busy = false; tick(); }
});

// ---------- DEMO MODE (localStorage) ----------
function demoLoad(){
  try { const d = JSON.parse(localStorage.getItem("ow_demo") || "null"); if (d) return d; } catch(_){}
  return { cur:{ content:"hello", contentType:"word", by:"guest", style:"minimal", updatedAt:Date.now()-90000 }, stats:{ totalChanges:0, longestHold:0 }, hist:[] };
}
function demoCreate(d){
  if (cdLeft() > 0) throw { code:"resource-exhausted", message:"E:Please wait for the cooldown." };
  const D = demoLoad(), t = Date.now();
  const held = Math.floor((t-D.cur.updatedAt)/1000);
  D.hist.unshift(Object.assign({}, D.cur, { id:String(t), createdAt:t, heldSeconds:held })); D.hist = D.hist.slice(0,10);
  D.stats.totalChanges++;
  if (held > D.stats.longestHold) Object.assign(D.stats, { longestHold:held, recordWord:D.cur.content, recordType:D.cur.contentType, recordBy:D.cur.by });
  D.cur = Object.assign({}, d, { updatedAt:t });
  localStorage.setItem("ow_demo", JSON.stringify(D));
  demoShow(D);
}
function demoShow(D){ stats = D.stats; hist = D.hist; renderHist(); setCur(D.cur); }

// ---------- boot ----------
if (!SB_URL || !SB_KEY || !window.supabase){
  demo = true; ready = true;
  $("mode").textContent = "DEMO";
  $("note").textContent = "Demo mode — changes are saved only on this device.";
  demoShow(demoLoad());
} else {
  const sb = supabase.createClient(SB_URL, SB_KEY);
  const T = x => Date.parse(x);
  const mapCur = d => ({ content:d.content, contentType:d.content_type, by:d.by_name, style:d.style, updatedAt:T(d.updated_at) });
  const mapHist = d => ({ id:String(d.id), content:d.content, contentType:d.content_type, by:d.by_name, style:d.style, heldSeconds:d.held_seconds, createdAt:T(d.created_at) });
  const mapStats = d => ({ totalChanges:d.total_changes, longestHold:d.longest_hold, recordWord:d.record_word, recordType:d.record_type });
  const bad = () => { $("mode").textContent = "OFFLINE"; };
  async function loadAll(){
    try {
      const [c, s, h] = await Promise.all([
        sb.from("game_current").select("*").eq("id", 1).single(),
        sb.from("game_stats").select("*").eq("id", 1).single(),
        sb.from("changes").select("*").order("created_at", { ascending:false }).limit(10)
      ]);
      if (c.error || s.error || h.error) throw 0;
      stats = mapStats(s.data); hist = h.data.map(mapHist); renderHist(); setCur(mapCur(c.data));
      $("mode").textContent = "LIVE";
    } catch(e){ bad(); }
  }
  callCreate = async d => {
    const { error } = await sb.rpc("create_content", { p_content:d.content, p_type:d.contentType, p_by:d.by, p_style:d.style });
    if (error) throw error;
  };
  loadAll();
  sb.channel("one-word")
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"game_current" }, p => setCur(mapCur(p.new)))
    .on("postgres_changes", { event:"UPDATE", schema:"public", table:"game_stats" }, p => { stats = mapStats(p.new); renderStats(); })
    .on("postgres_changes", { event:"INSERT", schema:"public", table:"changes" }, p => {
      const h = mapHist(p.new);
      if (!hist.some(x => x.id === h.id)) { hist.unshift(h); hist = hist.slice(0, 10); renderHist(); }
    })
    .subscribe();
  setInterval(() => { if (!document.hidden) loadAll(); }, 30000);
  // anonymous sign-in gives each visitor a signed id the server can rate-limit
  sb.auth.getSession().then(async ({ data }) => {
    if (!data.session) { const { error } = await sb.auth.signInAnonymously(); if (error) return bad(); }
    ready = true; tick();
  });
  // sync our clock with the server so every visitor sees the same "Held for"
  const sync = async () => { try { const t0 = Date.now(), { data } = await sb.rpc("server_time"), t1 = Date.now(); if (data) offset = T(data) - (t0+t1)/2; } catch(_){} };
  sync(); setInterval(sync, 300000);
}
</script>
